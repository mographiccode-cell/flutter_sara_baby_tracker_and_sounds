name: Build Masroofi APK

on:
  push:
    branches:
      - masroofi-build-20260905
    paths:
      - 'masroofi_app_for_build.zip.b64'
      - '.github/workflows/masroofi_build.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Restore Masroofi source
        shell: bash
        run: |
          base64 --decode masroofi_app_for_build.zip.b64 > /tmp/masroofi.zip
          unzip -q -o /tmp/masroofi.zip
          test -f masroofi/pubspec.yaml
          test -f masroofi/lib/main.dart

      - name: Generate Android project
        working-directory: masroofi
        run: |
          flutter create . --platforms=android --org com.mographiccode --project-name masroofi
          sed -i 's/intl: \^0.20.3/intl: any/' pubspec.yaml
          flutter pub get

      - name: Analyze
        working-directory: masroofi
        run: flutter analyze || true

      - name: Build release APK
        working-directory: masroofi
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          test -s masroofi/build/app/outputs/flutter-apk/app-release.apk
          ls -lh masroofi/build/app/outputs/flutter-apk/app-release.apk
          sha256sum masroofi/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masroofi-APK
          path: masroofi/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
