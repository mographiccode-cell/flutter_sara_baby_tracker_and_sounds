name: Temporary Masroofi APK Build

on:
  push:
    branches:
      - main
    paths:
      - 'masroofi_build_main_trigger.txt'
      - '.github/workflows/masroofi_build_temp.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated Masroofi branch
        uses: actions/checkout@v4
        with:
          ref: masroofi-build-20260905

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Restore and verify Masroofi source
        shell: bash
        run: |
          cat masroofi_chunks/part_* > /tmp/masroofi.b64
          base64 --decode /tmp/masroofi.b64 > /tmp/masroofi.zip
          echo "dd3671a009758463ddc9ce8e4236f8f8a63eb8ef9a64f7db7b03a66625e91e6d  /tmp/masroofi.zip" | sha256sum -c -
          unzip -q -o /tmp/masroofi.zip
          test -f masroofi/pubspec.yaml
          test -f masroofi/lib/main.dart

      - name: Generate Android project
        working-directory: masroofi
        run: |
          flutter create . --platforms=android --org com.mographiccode --project-name masroofi
          sed -i 's/intl: \^0.20.3/intl: any/' pubspec.yaml
          flutter pub get

      - name: Analyze
        working-directory: masroofi
        run: flutter analyze || true

      - name: Build release APK
        working-directory: masroofi
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          test -s masroofi/build/app/outputs/flutter-apk/app-release.apk
          ls -lh masroofi/build/app/outputs/flutter-apk/app-release.apk
          sha256sum masroofi/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masroofi-APK
          path: masroofi/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
